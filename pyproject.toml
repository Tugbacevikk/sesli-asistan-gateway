[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sesli-asistan-gateway"
version = "0.1.0"
description = "Santral sesli yönlendirme asistanı (yalnızca Türkçe): RTP → STT → LLM + rehber → TTS → RTP"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",          # yeniden örnekleme (resample_poly); soxr (LGPL) yerine
]

[project.optional-dependencies]
# STT servisi (ayrı süreç, ayrı venv)
stt = [
    "faster-whisper>=1.1",
    "sherpa-onnx>=1.12",   # Silero VAD (ONNX, PyTorch'suz)
    "grpcio>=1.85.0",
    "grpcio-health-checking>=1.85.0",
    "protobuf>=7.35.1",    # üretilmiş kodun gerektirdiği en düşük sürüm (contracts/)
    "pydantic-settings",
]
# STT GPU'da: cuBLAS 12 + cuDNN 9 pip'ten (sistemde CUDA Toolkit gerekmez; stt/engine.py load_cuda_libraries)
stt-cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
# Gateway servisi (ayrı süreç, ayrı venv)
gateway = [
    "fastapi",
    "uvicorn",
    "httpx",
    "rapidfuzz",
    "pydantic-settings",
    "grpcio>=1.85.0",
    "protobuf>=7.35.1",
]
tools = [
    "soundfile",
    "pyyaml",
    "huggingface_hub",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "import-linter",
    "jiwer",
    "grpcio-tools==1.85.0",          # proto kod üretimi; sürüm sabit: üretilen kod CI'da karşılaştırılır
    "grpcio-health-checking>=1.85.0",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["models: modeller indirilmiş olmalı (models/ klasörü)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Servis sınırları kodla denetlenir (tasarim.md 4.3, ADR-003):
#   - libs hiçbir servisi bilmez (ortak, saf kod).
#   - gateway ile stt birbirini import etmez; yalnızca gRPC sözleşmesiyle konuşur.
[tool.importlinter]
root_package = "sesli_asistan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "libs servisleri bilmez"
type = "forbidden"
source_modules = ["sesli_asistan.libs"]
forbidden_modules = ["sesli_asistan.gateway", "sesli_asistan.stt"]

[[tool.importlinter.contracts]]
name = "gateway ve stt birbirinden bağımsız (gRPC sözleşmesi)"
type = "independence"
modules = ["sesli_asistan.gateway", "sesli_asistan.stt"]

[[tool.importlinter.contracts]]
name = "Gateway model kütüphanesi bilmez"
type = "forbidden"
source_modules = ["sesli_asistan.gateway"]
forbidden_modules = ["faster_whisper", "ctranslate2", "sherpa_onnx", "onnxruntime"]

[[tool.importlinter.contracts]]
name = "Gateway çekirdeği adaptörleri ve çerçeveleri bilmez (hexagonal)"
type = "forbidden"
source_modules = ["sesli_asistan.gateway.core"]
forbidden_modules = ["sesli_asistan.gateway.adapters", "sesli_asistan.gateway.api", "sesli_asistan.gateway.composition",
                     "sesli_asistan.contracts", "fastapi", "uvicorn", "httpx", "grpc"]

[tool.ruff.lint.per-file-ignores]
"src/sesli_asistan/contracts/**" = ["E", "F", "W", "I", "B", "UP"]   # üretilmiş kod
