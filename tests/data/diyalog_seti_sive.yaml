# Şive seti: yöresel söyleyiş metin olarak (STT'nin şiveyi standart yazıma çevirmediği durum). Rehber:
# data/sirket_rehber.json. Eğitim verisine GİRMEZ (anlama_veri.py diyalog setlerindeki sözleri dışlar).
# Asıl şive sınavı sesle yapılır (STT); bu set yalnız LLM'in yöresel sözcük ve ekleri anlamasını ölçer.
# CI'da koşmaz (LLM gerekir):
#   python tests/eval/diyalog.py --anlama --set tests/data/diyalog_seti_sive.yaml --rehber data/sirket_rehber.json
# Yazım: STT çıktısı gibi küçük harf, noktalamasız. "he" evet sayılır (phrases.YES_WORDS).

