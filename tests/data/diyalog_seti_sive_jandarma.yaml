# Şive + jandarma seti: yöresel söyleyişle jandarma birimlerini, rütbeli / unvanlı kişileri arama. Rehber:
# data/demo_rehber.json (ince ayar verisinde test rehberi: eğitimde hiç görülmez). Eğitim verisine GİRMEZ.
# CI'da koşmaz (LLM gerekir):
#   python tests/eval/diyalog.py --anlama --set tests/data/diyalog_seti_sive_jandarma.yaml --rehber data/demo_rehber.json
# Yazım: STT çıktısı gibi küçük harf, noktalamasız. "he" evet sayılır.

# --- BİRİM HATLARI ---
- id: J01
  aciklama: "Karadeniz: jandarmaya bağlayasun"
  konusma: ["uşağum jandarmaya bağlayasun beni"]
  beklenen: {eylem: transfer, dahili: "30000"}

- id: J02
  aciklama: "Doğu: jandarmanın asayişine"
  konusma: ["gardaş jandarmanın asayiş şubesine ver beni"]
  beklenen: {eylem: transfer, dahili: "30100"}

- id: J03
  aciklama: "Ege: jandarma personele bağlayıver"
  konusma: ["efem jandarma personele bağlayıver hele"]
  beklenen: {eylem: transfer, dahili: "30200"}

- id: J04
  aciklama: "İç Anadolu: jandarma lojistik, -ıvesene"
  konusma: ["jandarmanın lojistiğine bağlayıvesene bacım"]
  beklenen: {eylem: transfer, dahili: "30300"}

# --- MAKAM / UNVAN ---
- id: J05
