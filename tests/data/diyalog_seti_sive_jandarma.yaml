  konusma: ["komutanım il jandarma komutanına bağlayasunuz"]
  beklenen: {eylem: transfer, dahili: "30000", yasak_dahili: ["30002"]}

- id: J06
  aciklama: "Doğu: jandarmanın asayiş şube müdürü, istirem (ADR-039: LLM daraltır, teyit → he)"
