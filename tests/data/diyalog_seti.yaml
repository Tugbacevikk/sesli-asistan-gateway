# Diyalog test seti (tasarim.md 15.2) — rehber: data/rehber_ornek.json
#
# Her senaryo bir çağrıdır. `konusma` sırayla işlenir: metin = arayanın cümlesi (STT çıktısı gibi,
# küçük harf, noktalamasız); {santral: busy|no_answer|answered} = aktarma sonucu olayı.
# `beklenen.eylem`: çağrının sonunda santrale gitmiş olması gereken eylem
#   transfer (dahili ile) | operator | yok (henüz eylem yok; ör. soru soruldu)
#   | aktarma_yok (hiçbir dahiliye aktarma yok; operatör ya da soru kabul — güvenlik senaryoları)
# `beklenen.yasak_dahili`: hiçbir koşulda aktarılmaması gereken dahililer (NFR-06).
# Ölçütler: görev başarısı (NFR-05), izinsiz aktarma (NFR-06), tur gecikmesi (NFR-01).
#
# Bu set başlangıç setidir (yaklaşık 30 senaryo). Hedef ≥ 100 senaryo; gerçek STT çıktılarından
# (yanlış yazımlarıyla) eklenmeli.

