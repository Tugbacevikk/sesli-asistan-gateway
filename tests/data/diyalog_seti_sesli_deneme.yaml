# Sesli deneme okuma listesi (demo rehberi): mikrofonla /ui üzerinden okunur, sonra
# tools/deneme/sesli_rapor.py çağrı kayıtlarından "söylenen → duyulan → gidilen yer" tablosunu çıkarır.
# Rehber: data/demo_rehber.json
#
# Her senaryo AYRI çağrıdır (yeni çağrı aç, ilk cümleyi söyle; asistan sorarsa sıradaki cümleyi söyle, aktarınca
# çağrıyı kapat). Sıra önemli: rapor çağrıları bu sırayla eşler.
# Yazıyla doğrulama (CI'da da koşar): seste kalan bir senaryo yazıda geçiyorsa hata STT'dedir.
#   python tests/eval/diyalog.py --kural --set tests/data/diyalog_seti_sesli_deneme.yaml --rehber data/demo_rehber.json

