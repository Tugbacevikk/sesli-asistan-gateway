# Kilitli bağımlılıklarda bilinen güvenlik açığı taraması (PyPI danışma veritabanı).
# Haftalık ve elle: PR'ları kırmaz, sürümler donmuş olduğu için açık sonradan duyurulabilir.
name: Güvenlik taraması

on:
  schedule:
    - cron: "17 6 * * 1"        # pazartesi 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0
      - name: Kilit dosyalarını tara
        run: |
          durum=0
          for kilit in deploy/kilit/*.txt; do
            echo "::group::$kilit"
            pip-audit --requirement "$kilit" --no-deps --strict || durum=1
            echo "::endgroup::"
          done
          exit $durum
