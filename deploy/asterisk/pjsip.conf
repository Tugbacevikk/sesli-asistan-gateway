; Deneme santrali: 3 dahili + operatör. Telefonlar (MicroSIP, Linphone) bu hesaplarla kaydolur.
; Şifreleri kur.sh üretir (sifreler.txt). Yalnızca G.711 (Gateway'in kodeği): kod dönüşümü yok.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-sablon](!)
type=endpoint
context=dahili
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth-sablon](!)
type=auth
auth_type=userpass

[aor-sablon](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; 1001 — arayan (bilgisayardaki MicroSIP)
[1001](endpoint-sablon)
auth=1001
aors=1001
callerid="Arayan" <1001>
[1001](auth-sablon)
username=1001
password=@SIFRE_1001@
[1001](aor-sablon)

; 214 — Ayşe Yılmaz (telefondaki Linphone); rehber_ornek.json ile aynı dahili
[214](endpoint-sablon)
auth=214
aors=214
callerid="Ayse Yilmaz" <214>
[214](auth-sablon)
username=214
password=@SIFRE_214@
[214](aor-sablon)

; 231 — Ayşe Kaya (isteğe bağlı ikinci telefon)
[231](endpoint-sablon)
auth=231
aors=231
callerid="Ayse Kaya" <231>
[231](auth-sablon)
username=231
password=@SIFRE_231@
[231](aor-sablon)

; 900 — operatör
[900](endpoint-sablon)
auth=900
aors=900
callerid="Operator" <900>
[900](auth-sablon)
username=900
password=@SIFRE_900@
[900](aor-sablon)
