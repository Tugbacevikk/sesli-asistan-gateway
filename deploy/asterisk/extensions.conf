; Arama planı: 500 → sesli asistan (köprü); dahililer birbirini doğrudan arayabilir.
[general]
static=yes
writeprotect=yes

[dahili]
exten => 500,1,NoOp(Sesli asistan)
 same => n,Answer()
 same => n,Stasis(sesli-asistan)
 same => n,Hangup()

; 600 → okuma kaydı (STT ölçümü, tests/eval/okuma_listesi.tsv): bip sesinden sonra cümleler arada ~1,5 sn susarak
; okunur, kapatınca biter. Kayıt: /var/spool/asterisk/monitor/okuma-<zaman>.wav (8 kHz). tools/stt/okuma_bol.py
; cümlelere ayırır. Ses kişisel veridir: ölçümden sonra silin.
exten => 600,1,NoOp(Okuma kaydı)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Record(/var/spool/asterisk/monitor/okuma-${EPOCH}.wav,0,900,k)
 same => n,Hangup()

; köprü çalışmıyorsa (Stasis uygulaması yok) arayan operatöre gider
exten => 0,1,Dial(PJSIP/900,25)
 same => n,Hangup()

exten => _XXX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Hangup()

exten => _XXXX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Hangup()
