# Arayüz ve metrikler için HTTPS ters vekil (tasarim.md 10.2, 14.6) — örnek.
#
# Santral Gateway'e DOĞRUDAN bağlanır (iç ağ, :8000 + RTP); bu vekil yalnızca insanların kullandığı arayüz
# (/ui, WebSocket /v1/ui/ws, /v1/admin) ve Prometheus (/metrics) içindir. Tarayıcı mikrofonu yalnız HTTPS'te açar.
#
# Kurulum:  sudo cp deploy/nginx/sesli-asistan.conf /etc/nginx/sites-available/
#           sudo ln -s ../sites-available/sesli-asistan.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Gateway tarafı (gateway.env):
#   UI_ALLOWED_IPS=<yönetici ağındaki adresler>   (vekil gerçek adresi X-Forwarded-For ile iletir)
#   FORWARDED_ALLOW_IPS=127.0.0.1                 (yalnız bu vekile güvenilir)
#   API_KEY / UI_USERS dolu olmalı: arayüz ilk kez /ui?anahtar=... ile açılır; anahtar HttpOnly çereze çevrilip
#   adresten silinir. Erişim logunda sorgu dizesi yazılmaz (aşağıdaki log_format): anahtar loga düşmez.

# sorgu dizesiz erişim logu ($uri; $request değil): ?anahtar=… loglanmaz
log_format sesli_guvenli '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

upstream sesli_gateway {
    server 127.0.0.1:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name sesli-asistan.sirket.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sesli-asistan.sirket.local;
    access_log /var/log/nginx/sesli-asistan.access.log sesli_guvenli;

    ssl_certificate     /etc/ssl/sirket/sesli-asistan.crt;     # şirket iç sertifika otoritesinden
    ssl_certificate_key /etc/ssl/sirket/sesli-asistan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sesli:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # mikrofon yalnız bu sitenin kendisine
    add_header Permissions-Policy "microphone=(self)" always;

    # Yönetici ağı dışından erişim yok (Gateway de UI_ALLOWED_IPS ile ayrıca denetler)
    allow 10.0.0.0/8;          # ← kendi yönetici ağınız
    deny  all;

    client_max_body_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # istemcinin sahte başlığı EKLENMEZ, yerine yazılır
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / { return 302 /ui; }

    location /ui {
        proxy_pass http://sesli_gateway;
    }

    location /v1/admin/ {
        proxy_pass http://sesli_gateway;
    }

    location /v1/ui/ws {
        proxy_pass http://sesli_gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 900s;      # deneme çağrısı en çok MAX_CALL_DURATION_S (600 sn) + pay
    }

    location = /metrics {
        allow 10.0.5.10;           # ← Prometheus sunucusu
        deny  all;
        proxy_pass http://sesli_gateway;
    }

    # Santral API'si (/v1/calls) ve diğer her şey bu vekilden kapalı
    location / { return 404; }
}
