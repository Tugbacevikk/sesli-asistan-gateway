// Türkçe konuşmadan metne çevirme servisi (tasarim.md 6.3).
//
// Her çağrı için tek bir çift yönlü akış açılır: Gateway ses karelerini akıtır,
// STT servisi olayları döndürür. VAD ve cümle sonu kararı servistedir (ADR-004).
//
// Sözleşme kuralları:
//   - Alan numaraları değiştirilmez, silinen alan numarası yeniden kullanılmaz.
//   - Uyumsuz değişiklik yeni pakette yapılır (stt.v2).
//   - Gateway her akışta `x-call-id` meta verisini gönderir.
syntax = "proto3";

package stt.v1;

service SpeechToText {
  rpc Stream(stream AudioIn) returns (stream SttEvent);
}

message AudioIn {
  oneof msg {
    StreamConfig config = 1;   // akışın ilk mesajı, yalnızca bir kez
    bytes audio = 2;           // ses kareleri (20 ms)
    HotwordUpdate hotwords = 3;  // akış ortasında ipuçlarını değiştir (isteğe bağlı)
  }
}

// Akış ortasında ipucu güncellemesi: StreamConfig.hotwords'ün yerine geçer, bundan sonra çözülen cümlelerde
// geçerlidir. Gateway, rehber aramasının adaylarını öne alarak gönderir ("hangi Ayşe?" sorusundan sonra arayan
// büyük olasılıkla adaylardan birinin adını söyler). Eski STT sürümleri bu mesajı yok sayar.
message HotwordUpdate {
  repeated string hotwords = 1;
}

message StreamConfig {
  string call_id = 1;
  AudioCodec codec = 2;
  int32 sample_rate_hz = 3;    // 8000
  // Rehberden gelen ad/departman ipuçları (Whisper hotwords). Boş olabilir.
  repeated string hotwords = 4;
}

enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_PCMA = 1;
  AUDIO_CODEC_PCMU = 2;
  AUDIO_CODEC_PCM16 = 3;
}

message SttEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    SPEECH_STARTED = 1;        // barge-in için; en az STT_SPEECH_STARTED_MS (300 ms) sesli konuşmadan sonra
    PARTIAL = 2;               // ara sonuç (bu sürümde üretilmez; akışlı model için ayrıldı)
    FINAL = 3;                 // cümle sonucu
    NOT_RECOGNIZED = 4;        // konuşma vardı ama metin üretilemedi (neden: reason); Gateway tekrar sorar
  }
  Type type = 1;
  string text = 2;
  float confidence = 3;
  int64 audio_start_ms = 4;    // akış başından itibaren
  int64 audio_end_ms = 5;
  string reason = 6;           // NOT_RECOGNIZED için: "timeout" | "error" | "empty"
}
